name: Send website update email

on:
  push:
    branches:
      - main

jobs:
  send-email:
    runs-on: ubuntu-latest

    steps:
      - name: Send deployment notification
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          NOTIFY_EMAIL: ${{ secrets.NOTIFY_EMAIL }}
          SITE_URL: ${{ secrets.SITE_URL }}
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
          GITHUB_ACTOR: ${{ github.actor }}

        run: |
          node <<'NODE'
          const {
            RESEND_API_KEY,
            NOTIFY_EMAIL,
            SITE_URL,
            COMMIT_MESSAGE,
            GITHUB_ACTOR
          } = process.env;

          const response = await fetch("https://api.resend.com/emails", {
            method: "POST",
            headers: {
              "Authorization": `Bearer ${RESEND_API_KEY}`,
              "Content-Type": "application/json"
            },
            body: JSON.stringify({
              from: "Sports Website <onboarding@resend.dev>",
              to: [NOTIFY_EMAIL],
              subject: "스포츠 구단 웹사이트가 업데이트되었습니다",
              html: `
                <h2>웹사이트 업데이트 완료</h2>
                <p>새로운 수정본이 GitHub에 반영되었습니다.</p>

                <p>
                  <strong>사이트 주소</strong><br>
                  <a href="${SITE_URL}">${SITE_URL}</a>
                </p>

                <p>
                  <strong>수정 내용</strong><br>
                  ${COMMIT_MESSAGE || "웹사이트 업데이트"}
                </p>

                <p>
                  <strong>작업자</strong><br>
                  ${GITHUB_ACTOR}
                </p>
              `
            })
          });

          const result = await response.text();

          if (!response.ok) {
            console.error(result);
            process.exit(1);
          }

          console.log(result);
          NODE